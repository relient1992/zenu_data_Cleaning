// ─── CSV UTILITIES ────────────────────────────────────────────────────────────
function parseCSVLine(line) {
  const r=[]; let cur=""; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(c===','&&!inQ){r.push(cur);cur="";}
    else cur+=c;
  }
  r.push(cur); return r;
}
function parseCSV(text){
  const lines=text.split(/\r?\n/);
  if(!lines.length) return {headers:[],rows:[]};
  const headers=parseCSVLine(lines[0]).map(h=>h.trim().replace(/^"|"$/g,""));
  const rows=[];
  for(let i=1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const vals=parseCSVLine(lines[i]);
    const row={};
    headers.forEach((h,idx)=>{ row[h]=(vals[idx]??"").replace(/^"|"$/g,""); });
    rows.push(row);
  }
  return {headers,rows};
}
function toCSV(rows,headers){
  const esc=v=>{if(v===null||v===undefined)return"";const s=String(v);if(s.includes(",")||s.includes('"')||s.includes("\n"))return'"'+s.replace(/"/g,'""')+'"';return s;};
  return [headers.map(esc).join(","),...rows.map(r=>headers.map(h=>esc(r[h]??"")).join(","))].join("\n");
}
function downloadFile(content,filename){
  const b=new Blob([content],{type:"text/csv;charset=utf-8;"});
  const u=URL.createObjectURL(b);const a=document.createElement("a");
  a.href=u;a.download=filename;a.click();URL.revokeObjectURL(u);
}

// ─── TRANSFORMS ───────────────────────────────────────────────────────────────
function normalizeDate(val){
  if(!val||val==="NULL"||val==="") return {value:"",guessed:false};
  const v=val.trim();
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(v)) return {value:v,guessed:false};
  const iso=v.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(iso) return {value:`${iso[3]}/${iso[2]}/${iso[1]}`,guessed:false};
  const dt=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(dt) return {value:`${dt[1].padStart(2,"0")}/${dt[2].padStart(2,"0")}/${dt[3]}`,guessed:false};
  return {value:v,guessed:true};
}
function applyTransform(value,transform,overrides={}){
  if(!transform) return {value:value??"",guessed:false};
  const v=(value??"").toString().trim();
  if(transform==="date") return normalizeDate(v);
  if(transform==="bool"){
    const l=v.toLowerCase();
    if(["true","1","yes","t"].includes(l)) return {value:"True",guessed:false};
    if(["false","0","no","f"].includes(l)) return {value:"False",guessed:false};
    if(v==="") return {value:"",guessed:false};
    return {value:"",guessed:true};
  }
  if(transform==="semicolonToComma") return {value:v.replace(/;+/g,",").replace(/^,+|,+$/g,"").trim(),guessed:false};
  if(transform==="eagleTaskStatus") return {value:(v&&v!=="NULL")?"Completed":"Active",guessed:false};
  const table=overrides[transform]||VALUE_TRANSLATIONS[transform];
  if(table){
    const mapped=table[v]!==undefined?table[v]:table[v.toLowerCase()];
    if(mapped!==undefined) return {value:mapped,guessed:false};
    if(v&&v!=="NULL") return {value:v,guessed:true};
    return {value:"",guessed:false};
  }
  return {value:v,guessed:false};
}

function detectCRM(fileNames,allParsed){
  const names=new Set(fileNames.map(n=>n.toLowerCase()));
  const eagleFiles=["contacts.csv","appraisals.csv","tasks.csv","agents.csv"];
  if(eagleFiles.filter(f=>names.has(f)).length>=2){
    const c=allParsed["contacts.csv"];
    if(c){const h=new Set(c.headers);if(EAGLE_SIGNATURE.filter(s=>h.has(s)).length>=3)return "MRI Eagle";}
    return "MRI Eagle";
  }
  return "Unknown";
}

function detectDuplicates(rows){
  const seen=new Map();const dupes=new Set();
  rows.forEach((row,i)=>{
    const key=`${(row.first_name||"").toLowerCase()}|${(row.last_name||"").toLowerCase()}|${(row.email||"").toLowerCase()}`;
    if(key==="||") return;
    if(seen.has(key)){dupes.add(i);dupes.add(seen.get(key));}
    else seen.set(key,i);
  });
  return dupes;
}

async function processAllFiles({parsed,dupeResolutions,valueOverrides,onProgress}){
  const outputRows=[],errorRows=[],flagRows=[];
  const userMap={};
  (parsed["users.csv"]?.rows||[]).forEach(u=>{userMap[u.id]=`${u.first_name||""} ${u.last_name||""}`.trim();});
  (parsed["agents.csv"]?.rows||[]).forEach(a=>{userMap[a.user_id||a.id]=a.name||userMap[a.user_id]||"";});
  const propAgentMap={};
  (parsed["property_agencies.csv"]?.rows||[]).forEach(pa=>{
    if(!propAgentMap[pa.property_id]) propAgentMap[pa.property_id]=[];
    propAgentMap[pa.property_id].push({agent_id:pa.agent_id,pos:parseInt(pa.position)||0});
  });
  const filesToProcess=Object.entries(parsed).filter(([f])=>CRM_MAPPINGS[f]&&!LOOKUP_FILES.has(f));
  let processed=0;
  const total=filesToProcess.reduce((s,[,d])=>s+d.rows.length,0)||1;
  const dupeSet=detectDuplicates(parsed["contacts.csv"]?.rows||[]);

  for(const [fname,data] of filesToProcess){
    const mappingList=CRM_MAPPINGS[fname]||[];
    for(let i=0;i<data.rows.length;i++){
      const src=data.rows[i];
      processed++;
      if(processed%300===0){onProgress(Math.min(88,Math.round(processed/total*88)));await new Promise(r=>setTimeout(r,0));}
      if(fname==="contacts.csv"&&dupeSet.has(i)&&dupeResolutions[i]==="skip"){
        errorRows.push({file:fname,row:i+2,field:"duplicate",value:`${src.first_name} ${src.last_name}`,reason:"Duplicate contact — skipped by user"});
        continue;
      }
      const out={};
      ZENU_OUTPUT_HEADERS.forEach(h=>{out[h]="";});
      const noteParts={contact_notes:[],property_notes:[]};
      const rowErrors=[];
      const rowFlags=[];
      mappingList.forEach(m=>{
        if(!m.zenu||m.zenu==="_drop") return;
        const rawVal=src[m.source];
        if(rawVal===undefined) return;
        if(m.notesMerge){
          const {value}=applyTransform(rawVal,m.transform,valueOverrides);
          if(value&&value!=="NULL"&&value.trim()&&noteParts[m.zenu]) noteParts[m.zenu].push(value);
          return;
        }
        if(m.zenu==="(map to contact_notes)"){
          if(rawVal&&rawVal!=="NULL") noteParts.contact_notes.push(`[${m.source}] ${rawVal}`);
          return;
        }
        const {value,guessed}=applyTransform(rawVal,m.transform,valueOverrides);
        if(guessed&&value) rowFlags.push({file:fname,row:i+2,zenu_field:m.zenu,original_value:rawVal,converted_to:value});
        if(ZENU_OUTPUT_HEADERS.includes(m.zenu)) out[m.zenu]=value;
      });
      if(noteParts.contact_notes.length) out.contact_notes=noteParts.contact_notes.join(" | ");
      if(noteParts.property_notes.length) out.property_notes=noteParts.property_notes.join(" | ");
      if(fname==="contacts.csv"&&src.user_id) out.contact_team_member_1=userMap[src.user_id]||src.user_id;
      if(fname==="appraisals.csv"){
        if(src.agent_1_id) out.property_team_member_1=userMap[src.agent_1_id]||src.agent_1_id;
        if(src.agent_2_id) out.property_team_member_2=userMap[src.agent_2_id]||src.agent_2_id;
      }
      if(fname==="properties.csv"){
        const agents=(propAgentMap[src.id]||[]).sort((a,b)=>a.pos-b.pos);
        if(agents[0]) out.property_team_member_1=userMap[agents[0].agent_id]||agents[0].agent_id;
        if(agents[1]) out.property_team_member_2=userMap[agents[1].agent_id]||agents[1].agent_id;
      }
      if(fname==="tasks.csv"&&src.user_id) out.task_team_member_1=userMap[src.user_id]||src.user_id;
      if(fname==="contacts.csv"&&!out.contact_first_name&&!out.contact_surname&&!out.contact_company_name){
        rowErrors.push("No name or company — row skipped");
      }
      if(rowErrors.length){rowErrors.forEach(reason=>errorRows.push({file:fname,row:i+2,field:"validation",value:"",reason}));continue;}
      rowFlags.forEach(f=>flagRows.push(f));
      if(ZENU_OUTPUT_HEADERS.some(h=>out[h]!=="")) outputRows.push(out);
    }
  }
  onProgress(100);
  return {outputRows,errorRows,flagRows};
}

// ─── STAGE 2: MAPPING ─────────────────────────────────────────────────────────
function MappingStage({uploadData,onComplete}){
  const {parsed,crm}=uploadData;
  const buildDefaults=()=>{
    const state={};
    Object.entries(parsed).forEach(([fname,data])=>{
      if(LOOKUP_FILES.has(fname)) return;
      state[fname]={};
      const defs=CRM_MAPPINGS[fname]||[];
      data.headers.forEach(h=>{
        const found=defs.find(m=>m.source===h);
        state[fname][h]={zenu:found?.zenu||"",note:found?.note||"",status:found?"auto":"unmapped"};
      });
    });
    return state;
  };
  const [mappings,setMappings]=useState(buildDefaults);
  const [activeFile,setActiveFile]=useState(Object.keys(parsed).find(f=>!LOOKUP_FILES.has(f))||"");
  const [filter,setFilter]=useState("all");
  const allM=Object.values(mappings).flatMap(f=>Object.values(f));
  const autoCount=allM.filter(m=>m.status==="auto").length;
  const unmapCount=allM.filter(m=>!m.zenu).length;
  const curM=mappings[activeFile]||{};
  const headers=parsed[activeFile]?.headers||[];
  const visible=headers.filter(h=>{
    const m=curM[h];
    if(filter==="auto") return m?.status==="auto";
    if(filter==="unmapped") return !m?.zenu;
    return true;
  });
  const update=(fname,h,val)=>setMappings(p=>({...p,[fname]:{...p[fname],[h]:{...p[fname][h],zenu:val,status:val?"manual":"unmapped"}}}));
  const mappableFiles=Object.keys(parsed).filter(f=>!LOOKUP_FILES.has(f));

  return(
    <div>
      <h2 style={{fontSize:22,fontWeight:800,color:"#f1f5f9",margin:"0 0 6px"}}>Field Mapping</h2>
      <p style={{color:"#475569",fontSize:14,margin:"0 0 16px"}}>{crm==="MRI Eagle"?"Pre-loaded MRI Eagle mappings applied. ":""}Review every source → Zenu mapping. Output will match Zenu's exact 155-column schema.</p>
      <div style={{display:"flex",gap:8,marginBottom:18,flexWrap:"wrap"}}>
        <Chip color="green">✓ Auto-mapped: {autoCount}</Chip>
        {unmapCount>0&&<Chip color="amber">⚠ Unmapped: {unmapCount}</Chip>}
        <Chip color="blue">Output: 155 Zenu columns</Chip>
      </div>
      <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
        {mappableFiles.map(f=>(
          <button key={f} onClick={()=>setActiveFile(f)}
            style={{padding:"6px 14px",borderRadius:6,border:"1px solid",cursor:"pointer",fontSize:12,fontWeight:600,
              borderColor:activeFile===f?"#38bdf8":"#1a2d4a",background:activeFile===f?"rgba(14,165,233,0.1)":"transparent",color:activeFile===f?"#38bdf8":"#475569"}}>
            {f.replace(".csv","")}
          </button>
        ))}
      </div>
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        {["all","auto","unmapped"].map(f=>(
          <button key={f} onClick={()=>setFilter(f)}
            style={{padding:"4px 12px",borderRadius:5,border:"1px solid",cursor:"pointer",fontSize:12,fontWeight:600,
              borderColor:filter===f?"#38bdf8":"#1a2d4a",background:filter===f?"rgba(14,165,233,0.08)":"transparent",color:filter===f?"#38bdf8":"#475569"}}>
            {f==="all"?"All":f==="auto"?"Auto":"Unmapped"}
            {" "}({f==="all"?headers.length:f==="auto"?Object.values(curM).filter(m=>m.status==="auto").length:Object.values(curM).filter(m=>!m.zenu).length})
          </button>
        ))}
      </div>
      <div style={{background:"#070d1a",borderRadius:10,border:"1px solid #1a2d4a",overflow:"hidden"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1.3fr 80px",padding:"9px 16px",background:"#0d1d33",fontSize:11,fontWeight:700,color:"#334155",letterSpacing:"0.08em",textTransform:"uppercase"}}>
          <div>Source Field</div><div>→ Zenu Destination</div><div>Status</div>
        </div>
        <div style={{maxHeight:420,overflowY:"auto"}}>
          {visible.map((h,i)=>{
            const m=curM[h]||{};
            const dropped=m.zenu==="_drop"||m.zenu==="(drop - no Zenu equivalent)";
            return(
              <div key={h} style={{display:"grid",gridTemplateColumns:"1fr 1.3fr 80px",padding:"9px 16px",borderBottom:"1px solid #0d1d33",alignItems:"center",background:i%2?"rgba(255,255,255,0.01)":"transparent"}}>
                <div>
                  <div style={{fontSize:12,fontWeight:600,color:dropped?"#1e3a5f":"#94a3b8",fontFamily:"monospace"}}>{h}</div>
                  {m.note&&<div style={{fontSize:11,color:"#334155",marginTop:2}}>{m.note}</div>}
                </div>
                <select value={m.zenu||""} onChange={e=>update(activeFile,h,e.target.value)}
                  style={{width:"100%",background:"#0d1d33",border:"1px solid #1a2d4a",borderRadius:6,color:m.zenu?"#e2e8f0":"#334155",padding:"6px 8px",fontSize:12,cursor:"pointer",outline:"none"}}>
                  <option value="">— skip this field —</option>
                  <option value="(map to contact_notes)">→ Append to contact_notes</option>
                  <option value="(drop - no Zenu equivalent)">→ Drop (log in error report)</option>
                  <optgroup label="── Zenu Fields ──">
                    {ZENU_OUTPUT_HEADERS.map(f=><option key={f} value={f}>{f}</option>)}
                  </optgroup>
                </select>
                <div style={{paddingLeft:8}}>
                  <Chip color={m.status==="auto"?"green":m.zenu?"blue":"amber"}>
                    {m.status==="auto"?"auto":m.zenu?"manual":"skip"}
                  </Chip>
                </div>
              </div>
            );
          })}
          {visible.length===0&&<div style={{padding:"28px",textAlign:"center",color:"#1a2d4a",fontSize:13}}>No fields match filter.</div>}
        </div>
      </div>
      <div style={{marginTop:24,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:13,color:"#334155"}}>{unmapCount>0?`⚠ ${unmapCount} fields will be skipped`:"✓ All fields accounted for"}</div>
        <button onClick={()=>onComplete({mappings,parsed,crm})}
          style={{padding:"12px 32px",borderRadius:8,border:"none",background:"linear-gradient(135deg,#0ea5e9,#6366f1)",color:"#fff",fontWeight:800,fontSize:14,cursor:"pointer"}}>
          Continue to Review →
        </button>
      </div>
    </div>
  );
}

// ─── STAGE 3: REVIEW ─────────────────────────────────────────────────────────
function ReviewStage({mappingData}){
  const {parsed}=mappingData;
  const [mismatches,setMismatches]=useState([]);
  const [mismatchRes,setMismatchRes]=useState({});
  const [dupeRows,setDupeRows]=useState(new Set());
  const [dupeRes,setDupeRes]=useState({});
  const [processing,setProcessing]=useState(false);
  const [progress,setProgress]=useState(0);
  const [result,setResult]=useState(null);

  useEffect(()=>{
    const found=[];const seen=new Set();
    Object.entries(CRM_MAPPINGS).forEach(([fname,defs])=>{
      const rows=parsed[fname]?.rows||[];
      rows.forEach(row=>{
        defs.forEach(m=>{
          if(!m.transform||!VALUE_TRANSLATIONS[m.transform]) return;
          const val=row[m.source];
          if(!val||val==="NULL"||val==="") return;
          const table=VALUE_TRANSLATIONS[m.transform];
          if(table[val]===undefined&&table[val.toLowerCase()]===undefined){
            const key=`${m.transform}::${val}`;
            if(!seen.has(key)){seen.add(key);found.push({transform:m.transform,sourceValue:val,sourceField:m.source,zenuField:m.zenu,file:fname});}
          }
        });
      });
    });
    setMismatches(found);
    setDupeRows(detectDuplicates(parsed["contacts.csv"]?.rows||[]));
  },[]);

  const run=async()=>{
    setProcessing(true);setProgress(0);
    await new Promise(r=>setTimeout(r,30));
    const overrides={};
    Object.entries(mismatchRes).forEach(([key,val])=>{
      const [transform,sourceValue]=key.split("::");
      if(!overrides[transform]) overrides[transform]={...VALUE_TRANSLATIONS[transform]};
      overrides[transform][sourceValue]=val;
    });
    const {outputRows,errorRows,flagRows}=await processAllFiles({parsed,dupeResolutions:dupeRes,valueOverrides:overrides,onProgress:p=>setProgress(p)});
    const mainCsv=toCSV(outputRows,ZENU_OUTPUT_HEADERS);
    const errCsv=toCSV(errorRows,["file","row","field","value","reason"]);
    const flagCsv=toCSV(flagRows,["file","row","zenu_field","original_value","converted_to"]);
    setResult({mainCsv,errCsv,flagCsv,outputRows,errorRows,flagRows});
    setProcessing(false);
  };

  if(result) return <ExportStage result={result}/>;

  return(
    <div>
      <h2 style={{fontSize:22,fontWeight:800,color:"#f1f5f9",margin:"0 0 6px"}}>Review & Confirm</h2>
      <p style={{color:"#475569",fontSize:14,margin:"0 0 24px"}}>Confirm value translations and resolve any issues before generating your Zenu import file.</p>

      {mismatches.length>0&&(
        <div style={{marginBottom:28}}>
          <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:10}}>
            <h3 style={{fontSize:15,fontWeight:700,color:"#fbbf24",margin:0}}>⚠️ Value Mismatches — Confirmation Required</h3>
            <Chip color="amber">{mismatches.length}</Chip>
          </div>
          <p style={{fontSize:13,color:"#475569",margin:"0 0 12px"}}>These source values don't match known Zenu accepted values. Enter the correct Zenu value, or leave blank to pass through as-is.</p>
          <div style={{background:"#070d1a",borderRadius:10,border:"1px solid rgba(251,191,36,0.15)",overflow:"hidden"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 100px 1fr",padding:"9px 16px",background:"#0d1d33",fontSize:11,fontWeight:700,color:"#334155",textTransform:"uppercase",letterSpacing:"0.08em"}}>
              <div>Source Value</div><div>Zenu Field</div><div>File</div><div>Correct Zenu Value</div>
            </div>
            {mismatches.map((mm,i)=>(
              <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 1fr 100px 1fr",padding:"9px 16px",borderBottom:"1px solid #0d1d33",alignItems:"center"}}>
                <div style={{fontFamily:"monospace",fontSize:13,color:"#fbbf24"}}>{mm.sourceValue}</div>
                <div style={{fontSize:12,color:"#64748b"}}>{mm.zenuField}</div>
                <div style={{fontSize:11,color:"#334155"}}>{mm.file.replace(".csv","")}</div>
                <input type="text" placeholder="e.g. Sale, House, Hot..."
                  value={mismatchRes[`${mm.transform}::${mm.sourceValue}`]||""}
                  onChange={e=>setMismatchRes(p=>({...p,[`${mm.transform}::${mm.sourceValue}`]:e.target.value}))}
                  style={{background:"#0d1d33",border:"1px solid #1a2d4a",borderRadius:6,color:"#e2e8f0",padding:"6px 10px",fontSize:12,outline:"none",width:"90%"}}/>
              </div>
            ))}
          </div>
        </div>
      )}

      {dupeRows.size>0&&(
        <div style={{marginBottom:28,padding:"18px 20px",background:"rgba(239,68,68,0.04)",border:"1px solid rgba(239,68,68,0.15)",borderRadius:10}}>
          <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:8}}>
            <h3 style={{fontSize:15,fontWeight:700,color:"#f87171",margin:0}}>👥 Duplicate Contacts</h3>
            <Chip color="red">{dupeRows.size} rows</Chip>
          </div>
          <p style={{fontSize:13,color:"#475569",margin:"0 0 14px"}}>Contacts with identical first name + last name + email found. How should they be handled?</p>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>{const r={};dupeRows.forEach(i=>r[i]="keep");setDupeRes(r);}}
              style={{padding:"8px 18px",borderRadius:6,border:"1px solid #1a2d4a",background:"transparent",color:"#64748b",fontSize:13,cursor:"pointer",fontWeight:600}}>
              Keep all duplicates
            </button>
            <button onClick={()=>{const r={};dupeRows.forEach(i=>r[i]="skip");setDupeRes(r);}}
              style={{padding:"8px 18px",borderRadius:6,border:"1px solid rgba(239,68,68,0.3)",background:"rgba(239,68,68,0.08)",color:"#f87171",fontSize:13,cursor:"pointer",fontWeight:600}}>
              Skip duplicates (keep first)
            </button>
          </div>
        </div>
      )}

      {mismatches.length===0&&dupeRows.size===0&&(
        <div style={{padding:"20px",background:"rgba(34,197,94,0.04)",border:"1px solid rgba(34,197,94,0.15)",borderRadius:10,marginBottom:28,display:"flex",alignItems:"center",gap:14}}>
          <span style={{fontSize:28}}>✅</span>
          <div>
            <div style={{fontWeight:700,color:"#4ade80"}}>No issues detected</div>
            <div style={{color:"#475569",fontSize:13,marginTop:3}}>All value translations matched and no duplicate contacts found. Ready to generate.</div>
          </div>
        </div>
      )}

      {processing&&(
        <div style={{marginBottom:20}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <span style={{fontSize:13,color:"#475569"}}>Processing rows…</span>
            <span style={{fontSize:13,color:"#38bdf8",fontWeight:700}}>{progress}%</span>
          </div>
          <div style={{height:6,background:"#0d1d33",borderRadius:3,overflow:"hidden"}}>
            <div style={{height:"100%",width:`${progress}%`,background:"linear-gradient(90deg,#0ea5e9,#6366f1)",transition:"width 0.2s",borderRadius:3}}/>
          </div>
        </div>
      )}

      <div style={{display:"flex",justifyContent:"flex-end"}}>
        <button disabled={processing} onClick={run}
          style={{padding:"13px 36px",borderRadius:8,border:"none",background:processing?"#0d1d33":"linear-gradient(135deg,#22c55e,#0ea5e9)",color:processing?"#1a2d4a":"#fff",fontWeight:800,fontSize:15,cursor:processing?"not-allowed":"pointer"}}>
          {processing?"Processing…":"⚡ Generate Zenu Import Files"}
        </button>
      </div>
    </div>
  );
}

// ─── STAGE 4: EXPORT ──────────────────────────────────────────────────────────
function ExportStage({result}){
  const {mainCsv,errCsv,flagCsv,outputRows,errorRows,flagRows}=result;
  return(
    <div>
      <div style={{textAlign:"center",marginBottom:36}}>
        <div style={{fontSize:56,marginBottom:10}}>🎉</div>
        <h2 style={{fontSize:26,fontWeight:900,color:"#f1f5f9",margin:"0 0 8px",letterSpacing:"-0.02em"}}>Migration Files Ready</h2>
        <p style={{color:"#475569",fontSize:14}}>Output matches Zenu's exact 155-column import schema.</p>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14,marginBottom:30}}>
        {[{label:"Ready to Import",val:outputRows.length,color:"#22c55e",icon:"✅"},{label:"Rows with Issues",val:errorRows.length,color:"#f87171",icon:"❌"},{label:"Conversion Flags",val:flagRows.length,color:"#fbbf24",icon:"⚠️"}].map(s=>(
          <div key={s.label} style={{background:"#0d1d33",border:"1px solid #1a2d4a",borderRadius:12,padding:"22px 16px",textAlign:"center"}}>
            <div style={{fontSize:24,marginBottom:6}}>{s.icon}</div>
            <div style={{fontSize:32,fontWeight:900,color:s.color,letterSpacing:"-0.02em"}}>{s.val.toLocaleString()}</div>
            <div style={{fontSize:12,color:"#334155",marginTop:4}}>{s.label}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {[
          {label:"zenu_import.csv",desc:`155-column file ready to upload · ${outputRows.length.toLocaleString()} rows`,csv:mainCsv,fname:"zenu_import.csv",btn:"linear-gradient(135deg,#22c55e,#16a34a)",show:true},
          {label:"error_report.csv",desc:`Rows that couldn't be imported and why · ${errorRows.length.toLocaleString()} rows`,csv:errCsv,fname:"error_report.csv",btn:"linear-gradient(135deg,#ef4444,#dc2626)",show:errorRows.length>0},
          {label:"conversion_flags.csv",desc:`Rows where values were auto-converted · ${flagRows.length.toLocaleString()} rows`,csv:flagCsv,fname:"conversion_flags.csv",btn:"linear-gradient(135deg,#f59e0b,#d97706)",show:flagRows.length>0},
        ].filter(f=>f.show).map(f=>(
          <div key={f.label} style={{background:"#0d1d33",border:"1px solid #1a2d4a",borderRadius:12,padding:"18px 22px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:16}}>
            <div style={{display:"flex",alignItems:"center",gap:14}}>
              <span style={{fontSize:24}}>📋</span>
              <div>
                <div style={{fontWeight:700,color:"#e2e8f0",fontSize:15}}>{f.label}</div>
                <div style={{fontSize:12,color:"#334155",marginTop:2}}>{f.desc}</div>
              </div>
            </div>
            <button onClick={()=>downloadFile(f.csv,f.fname)}
              style={{padding:"10px 22px",borderRadius:8,border:"none",background:f.btn,color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer",whiteSpace:"nowrap"}}>
              ↓ Download
            </button>
          </div>
        ))}
      </div>
      {errorRows.length>0&&(
        <div style={{marginTop:28}}>
          <h3 style={{fontSize:14,fontWeight:700,color:"#f87171",marginBottom:10}}>Sample Issues (first 10)</h3>
          <div style={{background:"#070d1a",borderRadius:10,border:"1px solid #0d1d33",overflow:"hidden"}}>
            <div style={{display:"grid",gridTemplateColumns:"110px 55px 140px 1fr",padding:"8px 16px",background:"#0d1d33",fontSize:11,fontWeight:700,color:"#334155",textTransform:"uppercase",letterSpacing:"0.08em"}}>
              <div>File</div><div>Row</div><div>Field</div><div>Reason</div>
            </div>
            {errorRows.slice(0,10).map((e,i)=>(
              <div key={i} style={{display:"grid",gridTemplateColumns:"110px 55px 140px 1fr",padding:"8px 16px",borderBottom:"1px solid #0d1d33",fontSize:12}}>
                <div style={{color:"#334155",fontFamily:"monospace"}}>{(e.file||"").replace(".csv","")}</div>
                <div style={{color:"#334155"}}>{e.row}</div>
                <div style={{color:"#fbbf24",fontFamily:"monospace"}}>{e.field}</div>
                <div style={{color:"#64748b"}}>{e.reason}</div>
              </div>
            ))}
          </div>
        </div>
      )}
      <div style={{marginTop:22,padding:"16px 20px",background:"#0d1d33",border:"1px solid #1a2d4a",borderRadius:10,fontSize:13,color:"#334155",lineHeight:1.6}}>
        💡 <strong style={{color:"#64748b"}}>Next step:</strong> In Zenu go to Settings → Import → upload <code style={{color:"#38bdf8",background:"rgba(14,165,233,0.08)",padding:"1px 6px",borderRadius:3}}>zenu_import.csv</code>. For 300K+ note rows, split into 50K-row batches before uploading.
      </div>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App(){
  const [step,setStep]=useState(0);
  const [uploadData,setUploadData]=useState(null);
  const [mappingData,setMappingData]=useState(null);
  return(
    <div style={{minHeight:"100vh",background:"#070d1a",fontFamily:"'Segoe UI',system-ui,sans-serif",color:"#e2e8f0"}}>
      <div style={{borderBottom:"1px solid #0d1d33",padding:"0 40px",display:"flex",alignItems:"center",justifyContent:"space-between",height:60,background:"rgba(7,13,26,0.96)",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:32,height:32,borderRadius:8,background:"linear-gradient(135deg,#0ea5e9,#6366f1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>⚡</div>
          <div>
            <div style={{fontWeight:900,fontSize:15,letterSpacing:"-0.02em",color:"#f1f5f9"}}>Zenu Migration Tool</div>
            <div style={{fontSize:10,color:"#1a2d4a",letterSpacing:"0.1em",textTransform:"uppercase"}}>CRM Data Import</div>
          </div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          <span style={{fontSize:11,color:"#1a2d4a",marginRight:4}}>CRMs:</span>
          {[["MRI Eagle",true],["Reapit",false],["MRI Vault",false],["Box+Dice",false],["Rex",false]].map(([n,a])=>(
            <span key={n} style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:600,background:a?"rgba(34,197,94,0.1)":"transparent",color:a?"#4ade80":"#1a2d4a",border:`1px solid ${a?"rgba(34,197,94,0.25)":"#0d1d33"}`}}>{n}{a?" ✓":""}</span>
          ))}
        </div>
      </div>
      <div style={{maxWidth:920,margin:"0 auto",padding:"40px 24px"}}>
        <StepBar current={step}/>
        <div style={{background:"#0a1525",border:"1px solid #0d1d33",borderRadius:16,padding:"36px 40px",boxShadow:"0 32px 96px rgba(0,0,0,0.5)"}}>
          {step===0&&<UploadStage onComplete={d=>{setUploadData(d);setStep(1);}}/>}
          {step===1&&uploadData&&<MappingStage uploadData={uploadData} onComplete={d=>{setMappingData(d);setStep(2);}}/>}
          {step===2&&mappingData&&<ReviewStage mappingData={mappingData} onComplete={()=>setStep(3)}/>}
        </div>
        <div style={{marginTop:14,textAlign:"center",fontSize:11,color:"#0d1d33"}}>Zenu Migration Tool · 155-column exact schema · MRI Eagle v1 · v2.0</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
